<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIM::BENCH – Level 3</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Status indicator */
    #statusRow {
      position: absolute;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.5rem;
      align-items: center;
      z-index: 10;
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }
    .status-pill {
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .status-pill.active {
      color: var(--neon-green);
      border-color: var(--neon-green);
      box-shadow: 0 0 8px rgba(57,255,20,0.3);
    }

    /* Circles in Level 3 need pointer-events so mouseenter/leave work */
    #arena .circle { pointer-events: all; cursor: crosshair; }

    /* Green hover state */
    #arena .circle.hovered .circle-inner {
      border-color: var(--neon-green) !important;
      box-shadow: 0 0 22px rgba(57,255,20,0.8), inset 0 0 16px rgba(57,255,20,0.2) !important;
      background: radial-gradient(circle at 35% 35%, rgba(57,255,20,0.15), transparent 70%) !important;
    }
    #arena .circle.hovered .circle-letter {
      color: var(--neon-green) !important;
      text-shadow: 0 0 10px var(--neon-green) !important;
    }
  </style>
</head>
<body>

<div class="game-wrapper">

  <div class="hud">
    <div class="hud-left">
      <button class="back-btn" onclick="location.href='index.html'">← MENU</button>
      <div class="hud-title">LEVEL 03 &nbsp;/&nbsp; FOCUS</div>
    </div>
    <div class="hud-right">
      <div class="hud-stat">SCORE <span class="val" id="scoreEl">0</span></div>
      <div class="hud-stat">ZIEL  <span class="val" id="goalEl">30</span></div>
    </div>
  </div>

  <div class="goal-bar"><div class="goal-bar-fill" id="goalFill"></div></div>

  <div id="arena">
    <div class="flash" id="flash"></div>

    <div id="statusRow">
      <span class="status-pill" id="pillHover">🎯 HOVER</span>
      <span style="color:var(--border)">+</span>
      <span class="status-pill" id="pillKey">⌨ TASTE</span>
    </div>

    <div class="overlay" id="overlay">
      <h2 class="info">LEVEL 03</h2>
      <p>Das finale Level.<br>
         <strong style="color:var(--neon-cyan)">Hover</strong> mit der Maus über einen Kreis –
         er wird <strong style="color:var(--neon-green)">grün</strong>.<br>
         Dann drücke den angezeigten <strong style="color:var(--neon-green)">Buchstaben</strong> auf der Tastatur.</p>
      <p class="instructions">ZIEL: 30 TREFFER</p>
      <button class="btn btn-primary" id="startBtn">STARTEN</button>
    </div>
  </div>

</div>

<script src="js/game.js"></script>
<script>
const GOAL = 30;

// ── Wire up shared references ─────────────────
arena    = document.getElementById('arena');
scoreEl  = document.getElementById('scoreEl');
goalFill = document.getElementById('goalFill');
flash    = document.getElementById('flash');

// Currently hovered circle object (or null)
let hoveredCircle = null;

// ── Overlay helpers ───────────────────────────
function showOverlay(html) {
  let ov = document.getElementById('overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'overlay';
    ov.className = 'overlay';
    arena.appendChild(ov);
  }
  ov.innerHTML = html;
  ov.style.display = 'flex';
}

function hideOverlay() {
  const ov = document.getElementById('overlay');
  if (ov) ov.style.display = 'none';
}

// ── Status pills ──────────────────────────────
function updatePills() {
  document.getElementById('pillHover').classList.toggle('active', hoveredCircle !== null);
}

// ── Attach hover events to a newly created circle ──
onCircleCreated = (circleObj) => {
  circleObj.el.addEventListener('mouseenter', () => {
    if (!gameRunning) return;
    hoveredCircle = circleObj;
    circleObj.el.classList.add('hovered');
    updatePills();
  });

  circleObj.el.addEventListener('mouseleave', () => {
    if (hoveredCircle === circleObj) {
      hoveredCircle = null;
      updatePills();
    }
    circleObj.el.classList.remove('hovered');
  });
};

// ── When a circle expires, clear hover if needed ──
onCircleExpired = (c) => {
  if (hoveredCircle === c) {
    hoveredCircle = null;
    updatePills();
  }
};

// ── Keyboard handler ──────────────────────────
document.addEventListener('keydown', (e) => {
  if (!gameRunning) return;
  const ov = document.getElementById('overlay');
  if (ov && ov.style.display !== 'none') return;

  const key = e.key.toUpperCase();
  if (key.length !== 1 || key < 'A' || key > 'Z') return;

  // Brief pill flash
  const pillKey = document.getElementById('pillKey');
  pillKey.classList.add('active');
  setTimeout(() => pillKey.classList.remove('active'), 200);

  if (!hoveredCircle) {
    // Key pressed but no circle hovered → no penalty, just ignore
    return;
  }

  if (hoveredCircle.letter === key) {
    // ✓ Correct letter while hovering
    const hit = hoveredCircle;
    hoveredCircle = null;
    removeCircle(hit);
    score++;
    showFlash('hit');
    showScorePop(hit.x, hit.y - hit.size / 2);
    updateHUD(GOAL);
    updatePills();

    if (score >= GOAL) endGame(true);
  } else {
    // ✗ Wrong letter while hovering
    showFlash('miss');
    endGame(false);
  }
});

// ── Game over ─────────────────────────────────
function endGame(won) {
  stopGameLoop();
  hoveredCircle = null;
  saveHighScore(3, score);

  if (won) {
    showOverlay(`
      <h2 class="win">MEISTER!</h2>
      <div class="score-display">${score}</div>
      <p>Du hast alle drei Level abgeschlossen. Du bist ein AIM::BENCH Meister!</p>
      <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-primary"   onclick="restartGame()">NOCHMAL</button>
        <button class="btn btn-secondary" onclick="location.href='index.html'">MENU</button>
      </div>
    `);
  } else {
    showOverlay(`
      <h2 class="lose">GAME OVER</h2>
      <div class="score-display">${score}</div>
      <p>Falscher Buchstabe während dem Hover. Konzentrier dich!</p>
      <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-primary"   onclick="restartGame()">NOCHMAL</button>
        <button class="btn btn-secondary" onclick="location.href='index.html'">MENU</button>
      </div>
    `);
  }
}

function restartGame() {
  score = 0;
  hoveredCircle = null;
  updateHUD(GOAL);
  updatePills();
  hideOverlay();
  startRound();
}

// ── Start round ───────────────────────────────
function startRound() {
  startGameLoop(true);
}

// ── Init ──────────────────────────────────────
updateHUD(GOAL);
fetchLetterPool();

document.getElementById('startBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  hideOverlay();
  startRound();
});
</script>

</body>
</html>
