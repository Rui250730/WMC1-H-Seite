<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIM::BENCH – Level 1</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="game-wrapper">

  <!-- HUD -->
  <div class="hud">
    <div class="hud-left">
      <button class="back-btn" onclick="location.href='index.html'">← MENU</button>
      <div class="hud-title">LEVEL 01 &nbsp;/&nbsp; AIM</div>
    </div>
    <div class="hud-right">
      <div class="hud-stat">SCORE <span class="val" id="scoreEl">0</span></div>
      <div class="hud-stat">ZIEL  <span class="val" id="goalEl">50</span></div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="goal-bar"><div class="goal-bar-fill" id="goalFill"></div></div>

  <!-- Arena -->
  <div id="arena">
    <div class="flash" id="flash"></div>

    <!-- START OVERLAY -->
    <div class="overlay" id="overlay">
      <h2 class="info">LEVEL 01</h2>
      <p>Klicke die wachsenden Kreise mit der <strong style="color:var(--neon-cyan)">linken Maustaste</strong>.<br>
         Ein Klick <em>neben</em> einen Kreis beendet die Runde.</p>
      <p class="instructions">ZIEL: 50 TREFFER</p>
      <button class="btn btn-primary" id="startBtn">STARTEN</button>
    </div>
  </div>

</div>

<script src="js/game.js"></script>
<script>
// ── Config ────────────────────────────────────
const GOAL = 50;

// ── Wire up shared references ─────────────────
arena   = document.getElementById('arena');
scoreEl = document.getElementById('scoreEl');
goalFill= document.getElementById('goalFill');
flash   = document.getElementById('flash');

// ── Overlay helper ────────────────────────────
function showOverlay(html) {
  let ov = document.getElementById('overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'overlay';
    ov.className = 'overlay';
    arena.appendChild(ov);
  }
  ov.innerHTML = html;
  ov.style.display = 'flex';
}

function hideOverlay() {
  const ov = document.getElementById('overlay');
  if (ov) ov.style.display = 'none';
}

// ── Game over ─────────────────────────────────
function endGame(won) {
  stopGameLoop();
  saveHighScore(1, score);

  if (won) {
    unlockLevel(2);
    showOverlay(`
      <h2 class="win">LEVEL KLAR!</h2>
      <div class="score-display">${score}</div>
      <p>Großartig! Level 2 ist jetzt freigeschaltet.</p>
      <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-primary" onclick="nextLevel()">LEVEL 2 →</button>
        <button class="btn btn-secondary" onclick="restartGame()">NOCHMAL</button>
        <button class="btn btn-secondary" onclick="location.href='index.html'">MENU</button>
      </div>
    `);
  } else {
    showOverlay(`
      <h2 class="lose">GAME OVER</h2>
      <div class="score-display">${score}</div>
      <p>Du hast neben einen Kreis geklickt. Versuch es nochmal!</p>
      <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-primary" onclick="restartGame()">NOCHMAL</button>
        <button class="btn btn-secondary" onclick="location.href='index.html'">MENU</button>
      </div>
    `);
  }
}

function nextLevel()  { location.href = 'level2.html'; }

function restartGame() {
  score = 0;
  updateHUD(GOAL);
  hideOverlay();
  startRound();
}

// ── Circle expired = no penalty in Level 1 ────
onCircleExpired = (_c) => { /* circles can expire without penalty */ };

// ── Click handler ─────────────────────────────
arena.addEventListener('click', (e) => {
  if (!gameRunning) return;
  // Ignore clicks that originate from overlay buttons
  if (e.target.closest('.overlay')) return;

  const rect = arena.getBoundingClientRect();
  const px   = e.clientX - rect.left;
  const py   = e.clientY - rect.top;

  const hit = circleAtPoint(px, py);

  if (hit) {
    removeCircle(hit);
    score++;
    showFlash('hit');
    showScorePop(hit.x, hit.y - hit.size / 2);
    updateHUD(GOAL);

    if (score >= GOAL) endGame(true);
  } else {
    showFlash('miss');
    showMissX(px, py);
    endGame(false);
  }
});

// ── Start round ───────────────────────────────
function startRound() {
  startGameLoop(false); // no letters in Level 1
}

// ── Init ──────────────────────────────────────
updateHUD(GOAL);
document.getElementById('startBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  hideOverlay();
  startRound();
});
</script>

</body>
</html>
