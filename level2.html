<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIM::BENCH – Level 2</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Wrong-key flash on border */
    #arena.wrong-key {
      box-shadow: inset 0 0 40px rgba(255,36,66,0.25);
    }
  </style>
</head>
<body>

<div class="game-wrapper">

  <div class="hud">
    <div class="hud-left">
      <button class="back-btn" onclick="location.href='index.html'">← MENU</button>
      <div class="hud-title">LEVEL 02 &nbsp;/&nbsp; TYPE</div>
    </div>
    <div class="hud-right">
      <div class="hud-stat">SCORE <span class="val" id="scoreEl">0</span></div>
      <div class="hud-stat">ZIEL  <span class="val" id="goalEl">30</span></div>
    </div>
  </div>

  <div class="goal-bar"><div class="goal-bar-fill" id="goalFill"></div></div>

  <div id="arena">
    <div class="flash" id="flash"></div>
    <div class="overlay" id="overlay">
      <h2 class="info">LEVEL 02</h2>
      <p>Drücke den <strong style="color:var(--neon-cyan)">Buchstaben</strong> auf der Tastatur, der im Kreis angezeigt wird.<br>
         Die Maus wird <em>nicht</em> benötigt.<br>
         Ein falscher Buchstabe beendet die Runde.</p>
      <p class="instructions">ZIEL: 30 TREFFER</p>
      <button class="btn btn-primary" id="startBtn">STARTEN</button>
    </div>
  </div>

</div>

<script src="js/game.js"></script>
<script>
// ── Config ────────────────────────────────────
const GOAL = 30;

// ── Wire up shared references ─────────────────
arena    = document.getElementById('arena');
scoreEl  = document.getElementById('scoreEl');
goalFill = document.getElementById('goalFill');
flash    = document.getElementById('flash');

// ── Overlay helper ────────────────────────────
function showOverlay(html) {
  let ov = document.getElementById('overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'overlay';
    ov.className = 'overlay';
    arena.appendChild(ov);
  }
  ov.innerHTML = html;
  ov.style.display = 'flex';
}

function hideOverlay() {
  const ov = document.getElementById('overlay');
  if (ov) ov.style.display = 'none';
}

// ── Game over ─────────────────────────────────
function endGame(won) {
  stopGameLoop();
  saveHighScore(2, score);

  if (won) {
    unlockLevel(3);
    showOverlay(`
      <h2 class="win">LEVEL KLAR!</h2>
      <div class="score-display">${score}</div>
      <p>Perfekte Finger! Level 3 ist jetzt freigeschaltet.</p>
      <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-primary" onclick="nextLevel()">LEVEL 3 →</button>
        <button class="btn btn-secondary" onclick="restartGame()">NOCHMAL</button>
        <button class="btn btn-secondary" onclick="location.href='index.html'">MENU</button>
      </div>
    `);
  } else {
    showOverlay(`
      <h2 class="lose">GAME OVER</h2>
      <div class="score-display">${score}</div>
      <p>Falscher Buchstabe gedrückt. Konzentrier dich!</p>
      <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-primary" onclick="restartGame()">NOCHMAL</button>
        <button class="btn btn-secondary" onclick="location.href='index.html'">MENU</button>
      </div>
    `);
  }
}

function nextLevel()  { location.href = 'level3.html'; }

function restartGame() {
  score = 0;
  updateHUD(GOAL);
  hideOverlay();
  startRound();
}

// ── Expired circle = just disappears (no penalty) ──
onCircleExpired = (_c) => { /* circles can expire without penalty */ };

// ── Keyboard handler ──────────────────────────
document.addEventListener('keydown', (e) => {
  if (!gameRunning) return;
  const ov = document.getElementById('overlay');
  if (ov && ov.style.display !== 'none') return; // overlay still visible

  const key = e.key.toUpperCase();
  if (key.length !== 1 || key < 'A' || key > 'Z') return; // ignore non-letter keys

  // Find a circle that matches this letter
  const matchIdx = activeCircles.findIndex(c => c.letter === key);

  if (matchIdx !== -1) {
    const hit = activeCircles[matchIdx];
    removeCircle(hit);
    score++;
    showFlash('hit');
    showScorePop(hit.x, hit.y - hit.size / 2);
    updateHUD(GOAL);

    if (score >= GOAL) endGame(true);
  } else {
    // Wrong key pressed – check if any circle exists (if no circles yet, no penalty)
    if (activeCircles.length > 0) {
      showFlash('miss');
      // Flash wrong-key border
      arena.classList.add('wrong-key');
      setTimeout(() => arena.classList.remove('wrong-key'), 300);
      endGame(false);
    }
  }
});

// ── Start round ───────────────────────────────
function startRound() {
  startGameLoop(true); // WITH letters
}

// ── Init ──────────────────────────────────────
updateHUD(GOAL);

// Pre-fetch letters so pool is ready
fetchLetterPool();

document.getElementById('startBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  hideOverlay();
  startRound();
});
</script>

</body>
</html>
